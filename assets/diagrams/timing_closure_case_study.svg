<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
<title id="title">Incremental timing closure case-study flow</title><desc id="desc">Six equal-width steps from core verification through AXI integration, legal-route baseline, minimal fix, guardband, and TimingClosure incremental implementation.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef3f8"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b1f33" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5b6f82"/></marker><style>.f{font-family:Inter,"Segoe UI",Arial,sans-serif}.eyebrow{font-size:13px;font-weight:800;letter-spacing:1.4px;fill:#f37021}.heading{font-size:25px;font-weight:800;fill:#0b1f33}.step{font-size:15px;font-weight:800;fill:#0b1f33}.body{font-size:12px;font-weight:500;fill:#344b60}.small{font-size:11px;font-weight:600;fill:#506579}.gate{font-size:14px;font-weight:800;fill:#fff}</style></defs>
<rect width="1280" height="470" rx="24" fill="url(#bg)"/><text class="f eyebrow" x="54" y="48">PHYSICAL CLOSURE CASE STUDY</text><text class="f heading" x="54" y="82">From a verified core to a routable, timing-closed AXI system</text>
<line x1="143" y1="205" x2="1137" y2="205" stroke="#c7d2de" stroke-width="4"/>
<!-- x: 42, 245, 448, 651, 854, 1057; w=181 -->
<g class="f" filter="url(#shadow)">
<g transform="translate(42 125)"><rect width="181" height="160" rx="16" fill="#fff" stroke="#9eb4c8"/><circle cx="90.5" cy="0" r="24" fill="#2f80ed"/><text x="90.5" y="6" text-anchor="middle" class="gate">1</text><text x="90.5" y="43" text-anchor="middle" class="step">Core verified</text><text x="90.5" y="72" text-anchor="middle" class="body">Functional regression</text><text x="90.5" y="94" text-anchor="middle" class="body">and core implementation</text><rect x="28" y="119" width="125" height="25" rx="12" fill="#eaf3ff"/><text x="90.5" y="136" text-anchor="middle" class="small">known-good logic</text></g>
<g transform="translate(245 125)"><rect width="181" height="160" rx="16" fill="#fff" stroke="#f0a46d"/><circle cx="90.5" cy="0" r="24" fill="#f37021"/><text x="90.5" y="6" text-anchor="middle" class="gate">2</text><text x="90.5" y="43" text-anchor="middle" class="step">Full AXI integration</text><text x="90.5" y="72" text-anchor="middle" class="body">DMA · FIFO · PS boundary</text><text x="90.5" y="94" text-anchor="middle" class="body">changes physical context</text><rect x="26" y="119" width="129" height="25" rx="12" fill="#fff0e6"/><text x="90.5" y="136" text-anchor="middle" class="small">routing dominated</text></g>
<g transform="translate(448 125)"><rect width="181" height="160" rx="16" fill="#fff" stroke="#9eb4c8"/><circle cx="90.5" cy="0" r="24" fill="#425b76"/><text x="90.5" y="6" text-anchor="middle" class="gate">3</text><text x="90.5" y="43" text-anchor="middle" class="step">Legal-route baseline</text><text x="90.5" y="72" text-anchor="middle" class="body">Route errors = 0</text><text x="90.5" y="94" text-anchor="middle" class="body">DCP + hashes preserved</text><rect x="25" y="119" width="131" height="25" rx="12" fill="#edf1f5"/><text x="90.5" y="136" text-anchor="middle" class="small">not timing sign-off</text></g>
<g transform="translate(651 125)"><rect width="181" height="160" rx="16" fill="#fff" stroke="#8dc7bb"/><circle cx="90.5" cy="0" r="24" fill="#2a9d8f"/><text x="90.5" y="6" text-anchor="middle" class="gate">4</text><text x="90.5" y="43" text-anchor="middle" class="step">Minimal boundary fix</text><text x="90.5" y="72" text-anchor="middle" class="body">Break wide CE dependency</text><text x="90.5" y="94" text-anchor="middle" class="body">Keep datapath unchanged</text><rect x="25" y="119" width="131" height="25" rx="12" fill="#e8f6f3"/><text x="90.5" y="136" text-anchor="middle" class="small">small netlist delta</text></g>
<g transform="translate(854 125)"><rect width="181" height="160" rx="16" fill="#fff" stroke="#b3a3d6"/><circle cx="90.5" cy="0" r="24" fill="#7559a6"/><text x="90.5" y="6" text-anchor="middle" class="gate">5</text><text x="90.5" y="43" text-anchor="middle" class="step">Selective guardband</text><text x="90.5" y="72" text-anchor="middle" class="body">5.000 ns nominal</text><text x="90.5" y="94" text-anchor="middle" class="body">4.800 ns selected endpoints</text><rect x="26" y="119" width="129" height="25" rx="12" fill="#f2eef9"/><text x="90.5" y="136" text-anchor="middle" class="small">engineering margin</text></g>
<g transform="translate(1057 125)"><rect width="181" height="160" rx="16" fill="#0b1f33" stroke="#0b1f33"/><circle cx="90.5" cy="0" r="24" fill="#f37021"/><text x="90.5" y="6" text-anchor="middle" class="gate">6</text><text x="90.5" y="43" text-anchor="middle" class="gate">TimingClosure</text><text x="90.5" y="66" text-anchor="middle" class="gate">incremental</text><text x="90.5" y="96" text-anchor="middle" font-size="12" fill="#d7e0e9">Reuse audited</text><text x="90.5" y="118" text-anchor="middle" font-size="12" fill="#d7e0e9">failing paths reworked</text></g>
</g>
<g stroke="#5b6f82" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M223 205H240"/><path d="M426 205H443"/><path d="M629 205H646"/><path d="M832 205H849"/><path d="M1035 205H1052"/></g>
<g class="f"><rect x="42" y="332" width="1196" height="92" rx="16" fill="#fff" stroke="#d1dae4"/><text x="68" y="362" class="eyebrow">DUAL SIGN-OFF — RESULTS REMAIN PENDING UNTIL BOTH VIEWS ARE REPORTED</text><rect x="68" y="382" width="356" height="26" rx="13" fill="#eaf3ff"/><text x="246" y="400" text-anchor="middle" class="small">Nominal 5.000 ns: real 200 MHz requirement</text><rect x="462" y="382" width="356" height="26" rx="13" fill="#f2eef9"/><text x="640" y="400" text-anchor="middle" class="small">Guard 4.800 ns: selected-boundary margin</text><rect x="856" y="382" width="356" height="26" rx="13" fill="#e8f6f3"/><text x="1034" y="400" text-anchor="middle" class="small">Route · setup/hold · DRC · exception coverage</text></g>
</svg>