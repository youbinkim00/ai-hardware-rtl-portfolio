<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
  <title id="title">YOLOv5s project scope and evidence gates</title>
  <desc id="desc">The project advances from QAT checkpoint to PYNQ deployment through integer reference, golden vectors, RTL, AXI VIP, DMA integration, and physical implementation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbfe"/><stop offset="1" stop-color="#eef4fa"/></linearGradient>
    <filter id="s" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#173650" flood-opacity=".14"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6e879e"/></marker>
  </defs>
  <rect width="1500" height="520" rx="28" fill="url(#bg)"/>
  <text x="52" y="58" fill="#10253b" font-family="Arial, sans-serif" font-size="28" font-weight="700">Software model to deployable FPGA evidence</text>
  <text x="52" y="86" fill="#60788e" font-family="Arial, sans-serif" font-size="15">Each transition has an explicit artifact and an acceptance gate—not just a successful tool run.</text>
  <path d="M84 254H1418" stroke="#b8c7d5" stroke-width="5" stroke-linecap="round"/>

  <g font-family="Arial, sans-serif" filter="url(#s)">
    <g transform="translate(45 154)"><rect width="174" height="196" rx="20" fill="#fff" stroke="#d0dce7"/><rect width="174" height="9" rx="5" fill="#6d63d7"/><circle cx="87" cy="100" r="33" fill="#eeeafd" stroke="#8c82e7" stroke-width="2"/><text x="87" y="106" text-anchor="middle" fill="#6256c5" font-size="18" font-weight="700">QAT</text><text x="87" y="151" text-anchor="middle" fill="#10253b" font-size="16" font-weight="700">Checkpoint</text><text x="87" y="176" text-anchor="middle" fill="#73889b" font-size="12">accuracy baseline</text></g>
    <g transform="translate(250 154)"><rect width="174" height="196" rx="20" fill="#fff" stroke="#d0dce7"/><rect width="174" height="9" rx="5" fill="#a15acd"/><circle cx="87" cy="100" r="33" fill="#f4eafd" stroke="#b875de" stroke-width="2"/><text x="87" y="106" text-anchor="middle" fill="#8c45b5" font-size="18" font-weight="700">INT</text><text x="87" y="151" text-anchor="middle" fill="#10253b" font-size="16" font-weight="700">Integer Reference</text><text x="87" y="176" text-anchor="middle" fill="#73889b" font-size="12">bit-width · rounding</text></g>
    <g transform="translate(455 154)"><rect width="174" height="196" rx="20" fill="#fff" stroke="#d0dce7"/><rect width="174" height="9" rx="5" fill="#2f83d3"/><circle cx="87" cy="100" r="33" fill="#e7f2ff" stroke="#55a5e9" stroke-width="2"/><path d="M69 88h36M69 100h36M69 112h25" stroke="#2f83d3" stroke-width="4" stroke-linecap="round"/><text x="87" y="151" text-anchor="middle" fill="#10253b" font-size="16" font-weight="700">Golden Vectors</text><text x="87" y="176" text-anchor="middle" fill="#73889b" font-size="12">layer observability</text></g>
    <g transform="translate(660 139)"><rect width="174" height="226" rx="20" fill="#12314c" stroke="#f1922d" stroke-width="2"/><rect width="174" height="10" rx="5" fill="#ff992e"/><circle cx="87" cy="108" r="37" fill="#244963" stroke="#ffad4c" stroke-width="2"/><text x="87" y="115" text-anchor="middle" fill="#ffbd6d" font-size="19" font-weight="700">RTL</text><text x="87" y="164" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">Full Core</text><text x="87" y="190" text-anchor="middle" fill="#bfd0dd" font-size="12">cycle + numeric checks</text><rect x="39" y="204" width="96" height="26" rx="13" fill="#573719"/><text x="87" y="222" text-anchor="middle" fill="#ffc477" font-size="11">PRIMARY DUT</text></g>
    <g transform="translate(865 154)"><rect width="174" height="196" rx="20" fill="#fff" stroke="#d0dce7"/><rect width="174" height="9" rx="5" fill="#16a091"/><circle cx="87" cy="100" r="33" fill="#e3f7f3" stroke="#42bdaf" stroke-width="2"/><text x="87" y="106" text-anchor="middle" fill="#168b80" font-size="16" font-weight="700">AXI</text><text x="87" y="151" text-anchor="middle" fill="#10253b" font-size="16" font-weight="700">VIP Stress</text><text x="87" y="176" text-anchor="middle" fill="#73889b" font-size="12">gap · stall · packet</text></g>
    <g transform="translate(1070 154)"><rect width="174" height="196" rx="20" fill="#fff" stroke="#d0dce7"/><rect width="174" height="9" rx="5" fill="#1b9a7c"/><circle cx="87" cy="100" r="33" fill="#e1f5ec" stroke="#43b996" stroke-width="2"/><text x="87" y="106" text-anchor="middle" fill="#167b64" font-size="15" font-weight="700">DMA</text><text x="87" y="151" text-anchor="middle" fill="#10253b" font-size="16" font-weight="700">ZCU104 SoC</text><text x="87" y="176" text-anchor="middle" fill="#73889b" font-size="12">PS · DDR · stream</text></g>
    <g transform="translate(1275 154)"><rect width="174" height="196" rx="20" fill="#fff" stroke="#d0dce7"/><rect width="174" height="9" rx="5" fill="#3d6f99"/><circle cx="87" cy="100" r="33" fill="#e8eef4" stroke="#678aaa" stroke-width="2"/><text x="87" y="96" text-anchor="middle" fill="#355e80" font-size="12" font-weight="700">PLACE</text><text x="87" y="113" text-anchor="middle" fill="#355e80" font-size="12" font-weight="700">ROUTE</text><text x="87" y="151" text-anchor="middle" fill="#10253b" font-size="16" font-weight="700">Physical Proof</text><text x="87" y="176" text-anchor="middle" fill="#73889b" font-size="12">timing · resources</text></g>
  </g>
  <g stroke="#6e879e" stroke-width="2.5" marker-end="url(#a)"><path d="M219 254h31"/><path d="M424 254h31"/><path d="M629 254h31"/><path d="M834 254h31"/><path d="M1039 254h31"/><path d="M1244 254h31"/></g>

  <g font-family="Arial, sans-serif"><text x="52" y="416" fill="#10253b" font-size="13" font-weight="700">ACCEPTANCE GATES</text><rect x="52" y="437" width="285" height="46" rx="23" fill="#eeeafd"/><text x="194" y="465" text-anchor="middle" fill="#6256c5" font-size="13">Accuracy + numeric contract</text><rect x="354" y="437" width="285" height="46" rx="23" fill="#e7f2ff"/><text x="496" y="465" text-anchor="middle" fill="#286fae" font-size="13">Expected count + mismatch = 0</text><rect x="656" y="437" width="285" height="46" rx="23" fill="#e2f6f2"/><text x="798" y="465" text-anchor="middle" fill="#177e73" font-size="13">Handshake + backpressure safety</text><rect x="958" y="437" width="285" height="46" rx="23" fill="#fff0df"/><text x="1100" y="465" text-anchor="middle" fill="#a85a10" font-size="13">Route + timing + DRC</text><rect x="1260" y="437" width="189" height="46" rx="23" fill="#e7edf3"/><text x="1354" y="458" text-anchor="middle" fill="#3d607e" font-size="12">PYNQ deployment</text><text x="1354" y="474" text-anchor="middle" fill="#7d8fa0" font-size="11">next evidence stage</text></g>
</svg>
