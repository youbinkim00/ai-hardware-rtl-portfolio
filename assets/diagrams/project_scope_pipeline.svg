<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
<title id="title">YOLOv5s project scope and evidence gates</title><desc id="desc">Aligned evidence stages from QAT checkpoint to physical proof, with RTL highlighted by border rather than a different card size.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbfe"/><stop offset="1" stop-color="#eef4fa"/></linearGradient><filter id="s" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#173650" flood-opacity=".13"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6e879e"/></marker><style>.f{font-family:Inter,"Segoe UI",Arial,sans-serif}</style></defs>
<rect width="1500" height="520" rx="28" fill="url(#bg)"/><text class="f" x="52" y="58" fill="#10253b" font-size="28" font-weight="700">Software model to deployable FPGA evidence</text><text class="f" x="52" y="86" fill="#60788e" font-size="15">Each transition has an explicit artifact and acceptance gate—not just a successful tool run.</text>
<path d="M84 252H1418" stroke="#b8c7d5" stroke-width="5" stroke-linecap="round"/>
