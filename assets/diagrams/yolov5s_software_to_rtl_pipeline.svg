<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="455" viewBox="0 0 1400 455" role="img" aria-labelledby="title desc">
<title id="title">YOLOv5s Software-to-RTL Integer Pipeline</title>
<desc id="desc">Training, quantization, mixed precision, integer export, standalone reference, golden vectors, and RTL scoreboard.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFD"/><stop offset="1" stop-color="#EEF3F8"/></linearGradient>
  <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6C63D9"/><stop offset="1" stop-color="#A05AD1"/></linearGradient>
  <linearGradient id="contract" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F28B27"/><stop offset="1" stop-color="#FFB347"/></linearGradient>
  <linearGradient id="verify" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#159D91"/><stop offset="1" stop-color="#49C9B9"/></linearGradient>
  <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#16324B" flood-opacity=".13"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#758AA0"/></marker>
  <style>
    .f{font-family:Pretendard,"Noto Sans KR","Segoe UI",Arial,sans-serif}
    .h1{font-size:29px;font-weight:800;fill:#10253B}
    .sub{font-size:15px;font-weight:500;fill:#526A80}
    .section{font-size:12px;font-weight:800;letter-spacing:.8px}
    .cardTitle{font-size:18px;font-weight:800;fill:#10253B}
    .cardBody{font-size:13px;font-weight:600;fill:#526A80}
    .tiny{font-size:11.5px;font-weight:700}
    .chip{font-size:11px;font-weight:800}
  </style>
</defs>

<rect width="1400" height="455" rx="28" fill="url(#bg)"/>
<text class="f h1" x="54" y="58">Software → RTL 정수화·검증 흐름</text>
<text class="f sub" x="54" y="87">학습 결과를 그대로 RTL에 넘기지 않고, 정수 파라미터와 독립 reference를 만들어 bit-exact 검증까지 연결합니다.</text>
<rect x="54" y="111" width="1292" height="4" rx="2" fill="#D8E2EC"/>

<!-- Section labels -->
<text class="f section" x="64" y="148" fill="#6C63D9">SOFTWARE TRAINING</text>
<text class="f section" x="607" y="148" fill="#F28B27">HW NUMERIC CONTRACT</text>
<text class="f section" x="1018" y="148" fill="#159D91">RTL VERIFICATION</text>

<!-- cards -->
<g class="f" filter="url(#shadow)">
  <g transform="translate(54 170)">
    <rect width="182" height="172" rx="18" fill="#FFFFFF" stroke="#CFC8F0" stroke-width="1.5"/>
    <rect width="182" height="7" rx="4" fill="#6C63D9"/>
    <circle cx="30" cy="32" r="17" fill="#EEEAFD"/><text x="30" y="38" text-anchor="middle" fill="#6C63D9" font-size="14" font-weight="800">1</text>
    <text class="cardTitle" x="22" y="73">FP32 Teacher</text>
    <text class="cardBody" x="22" y="101">VOC20 fine-tuning</text>
    <text class="cardBody" x="22" y="124">SiLU → ReLU recovery</text>
    <rect x="22" y="141" width="107" height="22" rx="11" fill="#F0EDFF"/><text class="chip" x="75.5" y="156" text-anchor="middle" fill="#675BCB">ACCURACY RECOVERY</text>
  </g>

  <g transform="translate(254 170)">
    <rect width="182" height="172" rx="18" fill="#FFFFFF" stroke="#CFC8F0" stroke-width="1.5"/>
    <rect width="182" height="7" rx="4" fill="#8663D6"/>
    <circle cx="30" cy="32" r="17" fill="#F1EBFA"/><text x="30" y="38" text-anchor="middle" fill="#8663D6" font-size="14" font-weight="800">2</text>
    <text class="cardTitle" x="22" y="73">INT8 QAT</text>
    <text class="cardBody" x="22" y="101">low-bit fine-tuning</text>
    <text class="cardBody" x="22" y="124">knowledge distillation</text>
    <rect x="22" y="141" width="94" height="22" rx="11" fill="#F3EEFC"/><text class="chip" x="69" y="156" text-anchor="middle" fill="#7B55B6">KD / QAT</text>
  </g>

  <g transform="translate(454 170)">
    <rect width="182" height="172" rx="18" fill="#FFFFFF" stroke="#DEC8EC" stroke-width="1.5"/>
    <rect width="182" height="7" rx="4" fill="#A05AD1"/>
    <circle cx="30" cy="32" r="17" fill="#F6EAFB"/><text x="30" y="38" text-anchor="middle" fill="#A05AD1" font-size="14" font-weight="800">3</text>
    <text class="cardTitle" x="22" y="73">Mixed Precision</text>
    <text class="cardBody" x="22" y="101">W4 weights</text>
    <text class="cardBody" x="22" y="124">selective A4 / A8</text>
    <rect x="22" y="141" width="109" height="22" rx="11" fill="#F7EDFB"/><text class="chip" x="76.5" y="156" text-anchor="middle" fill="#934FC3">BIT-WIDTH AUDIT</text>
  </g>

  <g transform="translate(654 170)">
    <rect width="182" height="172" rx="18" fill="#FFFFFF" stroke="#F0C38D" stroke-width="1.6"/>
    <rect width="182" height="7" rx="4" fill="#F28B27"/>
    <circle cx="30" cy="32" r="17" fill="#FFF0DF"/><text x="30" y="38" text-anchor="middle" fill="#E77B18" font-size="14" font-weight="800">4</text>
    <text class="cardTitle" x="22" y="73">Integer Export</text>
    <text class="cardBody" x="22" y="101">weight · bias · scale</text>
    <text class="cardBody" x="22" y="124">requant multiplier / shift</text>
    <rect x="22" y="141" width="119" height="22" rx="11" fill="#FFF2E5"/><text class="chip" x="81.5" y="156" text-anchor="middle" fill="#D96D0B">RTL PARAMETERS</text>
  </g>

  <g transform="translate(854 170)">
    <rect width="182" height="172" rx="18" fill="#FFFFFF" stroke="#F0C38D" stroke-width="1.6"/>
    <rect width="182" height="7" rx="4" fill="#F5A240"/>
    <circle cx="30" cy="32" r="17" fill="#FFF3E4"/><text x="30" y="38" text-anchor="middle" fill="#E88923" font-size="14" font-weight="800">5</text>
    <text class="cardTitle" x="22" y="73">Integer Reference</text>
    <text class="cardBody" x="22" y="101">standalone RTL/C-style</text>
    <text class="cardBody" x="22" y="124">rounding · saturation</text>
    <rect x="22" y="141" width="115" height="22" rx="11" fill="#FFF4E8"/><text class="chip" x="79.5" y="156" text-anchor="middle" fill="#D67916">BIT-EXACT MODEL</text>
  </g>

  <g transform="translate(1054 170)">
    <rect width="182" height="172" rx="18" fill="#FFFFFF" stroke="#9ED7D0" stroke-width="1.6"/>
    <rect width="182" height="7" rx="4" fill="#159D91"/>
    <circle cx="30" cy="32" r="17" fill="#E4F6F3"/><text x="30" y="38" text-anchor="middle" fill="#159D91" font-size="14" font-weight="800">6</text>
    <text class="cardTitle" x="22" y="73">Golden Vectors</text>
    <text class="cardBody" x="22" y="101">layer input / output</text>
    <text class="cardBody" x="22" y="124">expected count + data</text>
    <rect x="22" y="141" width="116" height="22" rx="11" fill="#EAF8F6"/><text class="chip" x="80" y="156" text-anchor="middle" fill="#13877D">OBSERVABILITY</text>
  </g>

  <g transform="translate(1254 170)">
    <rect width="92" height="172" rx="18" fill="#12314C" stroke="#12314C"/>
    <rect width="92" height="7" rx="4" fill="#48C7B7"/>
    <circle cx="46" cy="32" r="17" fill="#214E62"/><text x="46" y="38" text-anchor="middle" fill="#7CE7D7" font-size="14" font-weight="800">7</text>
    <text x="46" y="78" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">RTL</text>
    <text x="46" y="100" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">Scoreboard</text>
    <text x="46" y="128" text-anchor="middle" fill="#C7D9E5" font-size="11.5" font-weight="600">count + data</text>
    <text x="46" y="146" text-anchor="middle" fill="#C7D9E5" font-size="11.5" font-weight="600">PASS / FAIL</text>
  </g>
</g>

<!-- arrows -->
<g stroke="#758AA0" stroke-width="2.3" fill="none" marker-end="url(#arrow)">
  <path d="M236 256H250"/><path d="M436 256H450"/><path d="M636 256H650"/>
  <path d="M836 256H850"/><path d="M1036 256H1050"/><path d="M1236 256H1250"/>
</g>

<!-- artifact ribbon -->
<rect x="54" y="375" width="1292" height="47" rx="23.5" fill="#FFFFFF" stroke="#D8E2EC"/>
<text class="f tiny" x="183" y="404" text-anchor="middle" fill="#6C63D9">정확도 회복</text>
<circle cx="285" cy="398" r="4" fill="#CBD6E1"/>
<text class="f tiny" x="403" y="404" text-anchor="middle" fill="#8E57BF">정밀도 정책 확정</text>
<circle cx="542" cy="398" r="4" fill="#CBD6E1"/>
<text class="f tiny" x="675" y="404" text-anchor="middle" fill="#E27B18">정수 파라미터 생성</text>
<circle cx="810" cy="398" r="4" fill="#CBD6E1"/>
<text class="f tiny" x="942" y="404" text-anchor="middle" fill="#D27A20">독립 reference 검증</text>
<circle cx="1088" cy="398" r="4" fill="#CBD6E1"/>
<text class="f tiny" x="1215" y="404" text-anchor="middle" fill="#168D83">RTL 자동 비교</text>
</svg>