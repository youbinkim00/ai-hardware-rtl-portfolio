<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">AI Accelerator RTL Portfolio</title>
<desc id="desc">A recruiter-friendly portfolio map showing the engineering foundation, a MobileNetV1 classification accelerator, and a YOLOv5s object-detection accelerator.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071521"/><stop offset=".55" stop-color="#0a1d2d"/><stop offset="1" stop-color="#102a40"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2395ff"/><stop offset="1" stop-color="#63d4ff"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#16aa9a"/><stop offset="1" stop-color="#60ddc1"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff841d"/><stop offset="1" stop-color="#ffc254"/></linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000712" flood-opacity=".34"/></filter>
  <filter id="primary" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000712" flood-opacity=".38"/><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff982c" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8199b0"/></marker>
  <style>
    .f{font-family:Inter,"Segoe UI",Arial,sans-serif}
    .eyebrow{font-size:12px;font-weight:700;letter-spacing:.7px}
    .title{font-size:21px;font-weight:700}
    .body{font-size:13px}
    .small{font-size:11.5px}
    .chip{font-size:11px;font-weight:700;letter-spacing:.2px}
  </style>
</defs>
<rect width="1200" height="500" rx="28" fill="url(#bg)"/>

<text class="f" x="48" y="53" fill="#f8fbff" font-size="27" font-weight="700">AI Accelerator RTL Portfolio</text>
<text class="f" x="48" y="80" fill="#9ab0c3" font-size="14">모델 최적화부터 RTL, FPGA 구현, PYNQ 데모까지 직접 연결한 두 개의 AI 가속기 프로젝트</text>
<path d="M48 101H1152" stroke="#25445e"/><circle cx="50" cy="101" r="3.8" fill="#ff9a2f"/>

<path d="M378 278H421" stroke="#8199b0" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M778 278H821" stroke="#8199b0" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 01 -->
<g filter="url(#shadow)">
  <rect x="45" y="130" width="330" height="290" rx="23" fill="#0f2a40" stroke="#285676" stroke-width="1.3"/>
  <rect x="45" y="130" width="330" height="7" rx="4" fill="url(#blue)"/>
  <circle cx="84" cy="180" r="21" fill="#123b59" stroke="#4dc4ff" stroke-width="1.7"/>
  <path d="M73 180h22M84 169v22M76 172l16 16M92 172l-16 16" stroke="#70d7ff" stroke-width="2.1" stroke-linecap="round"/>
  <text class="f eyebrow" x="118" y="174" fill="#66ceff">01 · FOUNDATION</text>
  <text class="f title" x="118" y="202" fill="#fff">AI Hardware Survey</text>
  <path d="M72 224H348" stroke="#23445d"/>
  <text class="f body" x="72" y="256" fill="#d2dee8">무엇을 줄이고, 어디에 자원을 쓸지</text>
  <text class="f body" x="72" y="280" fill="#d2dee8">정량적으로 판단하는 설계 기준 정리</text>
  <rect x="72" y="316" width="138" height="32" rx="16" fill="#143e5c"/>
  <text class="f chip" x="141" y="337" text-anchor="middle" fill="#76d8ff">DESIGN TRADE-OFF</text>
  <text class="f small" x="72" y="385" fill="#7892a7">Quantization · Memory · Dataflow</text>
</g>

<!-- 02 MobileNet -->
<g filter="url(#shadow)">
  <rect x="435" y="130" width="330" height="290" rx="23" fill="#0f2d36" stroke="#28786d" stroke-width="1.3"/>
  <rect x="435" y="130" width="330" height="7" rx="4" fill="url(#teal)"/>
  <circle cx="474" cy="180" r="21" fill="#174a45" stroke="#55d7c0" stroke-width="1.7"/>
  <path d="M463 187h22M467 180h14M471 173h6" stroke="#77e6d1" stroke-width="2.5" stroke-linecap="round"/>
  <text class="f eyebrow" x="508" y="174" fill="#62ddc7">02 · IMPLEMENTED PROJECT</text>
  <text class="f title" x="508" y="199" fill="#fff">MobileNetV1</text>
  <text class="f" x="508" y="222" fill="#dce9e7" font-size="14">Lightweight CNN Accelerator</text>
  <path d="M462 239H738" stroke="#24524d"/>
  <text class="f body" x="462" y="270" fill="#d1dfdd">경량 CNN의 DWC/PWC 병목을</text>
  <text class="f body" x="462" y="294" fill="#d1dfdd">RTL 병렬화·메모리 재사용으로 해결</text>
  <rect x="462" y="318" width="84" height="29" rx="14.5" fill="#164b45"/><text class="f small" x="504" y="337" text-anchor="middle" fill="#7de8d5">252.7 FPS</text>
  <rect x="555" y="318" width="100" height="29" rx="14.5" fill="#164b45"/><text class="f small" x="605" y="337" text-anchor="middle" fill="#7de8d5">66.9 GOPS/W</text>
  <text class="f small" x="462" y="385" fill="#78978f">ZCU102 · AXI/DMA · PYNQ classification</text>
</g>

<!-- 03 YOLO -->
<g filter="url(#primary)">
  <rect x="825" y="130" width="330" height="290" rx="23" fill="#19283a" stroke="#b06a27" stroke-width="1.8"/>
  <rect x="825" y="130" width="330" height="7" rx="4" fill="url(#orange)"/>
  <circle cx="864" cy="180" r="21" fill="#583818" stroke="#ffb24d" stroke-width="1.7"/>
  <path d="M853 187l11-17 11 17M856 184h16M864 170v22" fill="none" stroke="#ffc56f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="f eyebrow" x="898" y="174" fill="#ffb14b">03 · MAIN PROJECT</text>
  <text class="f title" x="898" y="202" fill="#fff">YOLOv5s Accelerator</text>
  <path d="M852 224H1128" stroke="#4b3924"/>
  <text class="f body" x="852" y="255" fill="#d7e0e8">복잡한 객체검출 graph를 유지하면서</text>
  <text class="f body" x="852" y="279" fill="#d7e0e8">공유 PE·메모리·실행순서를 함께 최적화</text>
  <g class="f small" text-anchor="middle">
    <rect x="852" y="303" width="86" height="29" rx="14.5" fill="#573719"/><text x="895" y="322" fill="#ffc36c">90.8% PE</text>
    <rect x="947" y="303" width="126" height="29" rx="14.5" fill="#573719"/><text x="1010" y="322" fill="#ffc36c">mismatch 0</text>
  </g>
  <text class="f small" x="852" y="363" fill="#a8957f">ZCU104 · AXI/DMA · PYNQ detection demo</text>
  <text class="f small" x="852" y="387" fill="#8f7e6b">QAT → RTL → AXI → Physical implementation</text>
</g>

<rect x="315" y="447" width="570" height="30" rx="15" fill="#0b2235" stroke="#28485f"/>
<text class="f small" x="600" y="467" text-anchor="middle" fill="#9bb0c2">공통 역량: SW–HW co-design · SystemVerilog RTL · AXI SoC · FPGA physical implementation</text>
</svg>