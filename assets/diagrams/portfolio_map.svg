<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">AI Hardware RTL Engineering Portfolio Map</title>
<desc id="desc">Three aligned portfolio cards connect a hardware survey, the primary YOLOv5s RTL case, and an independently implemented MobileNetV1 RTL case.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#102944"/></linearGradient>
  <linearGradient id="survey" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1f8cff"/><stop offset="1" stop-color="#52c7ff"/></linearGradient>
  <linearGradient id="case" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff8a1f"/><stop offset="1" stop-color="#ffbd4a"/></linearGradient>
  <linearGradient id="mobile" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#15a99a"/><stop offset="1" stop-color="#59d5bd"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020812" flood-opacity=".34"/></filter>
  <filter id="primary" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020812" flood-opacity=".38"/><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff982c" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8ea8c3"/></marker>
  <style>.f{font-family:Inter,"Segoe UI",Arial,sans-serif}.label{font-size:13px;font-weight:700;letter-spacing:.25px}.title{font-size:21px;font-weight:700}.body{font-size:14px}.note{font-size:12px}.chip{font-size:12px;font-weight:600}</style>
</defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<text class="f" x="48" y="55" fill="#f7fbff" font-size="27" font-weight="700">Portfolio architecture</text>
<text class="f" x="48" y="82" fill="#91a8bd" font-size="14">KNOWLEDGE MAP  →  PRIMARY CASE  →  INDEPENDENT IMPLEMENTED CASE</text>
<path d="M40 96H1160" stroke="#1d3b58"/><circle cx="42" cy="96" r="4" fill="#ff9a2f"/>

<path d="M382 282H421" stroke="#8ea8c3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M772 282H811" stroke="#8ea8c3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

<g filter="url(#shadow)">
 <rect x="45" y="132" width="330" height="300" rx="24" fill="#10253b" stroke="#245071" stroke-width="1.5"/>
 <rect x="45" y="132" width="330" height="9" rx="5" fill="url(#survey)"/>
 <circle cx="87" cy="187" r="23" fill="#143c60" stroke="#49b8ff" stroke-width="2"/>
 <path d="M75 187h24M87 175v24M79 179l16 16M95 179l-16 16" stroke="#6dd0ff" stroke-width="2.3" stroke-linecap="round"/>
 <text class="f label" x="123" y="179" fill="#62caff">01 · FOUNDATION</text><text class="f title" x="123" y="207" fill="#fff">AI Hardware Survey</text>
 <path d="M73 230H347" stroke="#1c3d58"/>
 <text class="f body" x="73" y="270" fill="#c5d4e1">Quantization · pruning · dataflow</text><text class="f body" x="73" y="296" fill="#c5d4e1">Memory · power · physical design</text>
 <rect x="73" y="340" width="128" height="36" rx="18" fill="#143c60"/><text class="f chip" x="137" y="363" text-anchor="middle" fill="#76d5ff">TRADE-OFF MAP</text>
 <text class="f note" x="73" y="405" fill="#718ba3">Reusable evaluation vocabulary</text>
</g>

<g filter="url(#primary)">
 <rect x="435" y="132" width="330" height="300" rx="24" fill="#142338" stroke="#9a5d24" stroke-width="2"/>
 <rect x="435" y="132" width="330" height="9" rx="5" fill="url(#case)"/>
 <circle cx="477" cy="187" r="23" fill="#573719" stroke="#ffab40" stroke-width="2"/>
 <path d="M466 194l11-17 11 17M469 191h16M477 177v22" fill="none" stroke="#ffc36c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
 <text class="f label" x="513" y="179" fill="#ffae45">02 · PRIMARY CASE</text><text class="f" x="513" y="207" fill="#fff" font-size="19.5" font-weight="700">YOLOv5s RTL Accelerator</text>
 <path d="M463 230H737" stroke="#49351f"/>
 <g class="f" font-size="12.5" text-anchor="middle"><rect x="463" y="249" width="66" height="36" rx="10" fill="#233c56"/><text x="496" y="272" fill="#d6e5f0">QAT</text><rect x="547" y="249" width="66" height="36" rx="10" fill="#233c56"/><text x="580" y="272" fill="#d6e5f0">RTL</text><rect x="631" y="249" width="66" height="36" rx="10" fill="#233c56"/><text x="664" y="272" fill="#d6e5f0">AXI</text><path d="M529 267H545M613 267H629" stroke="#ffad43" stroke-width="2"/></g>
 <text class="f body" x="463" y="319" fill="#c5d4e1">Bit-exact verification</text><text class="f body" x="463" y="345" fill="#c5d4e1">ZCU104 · AXI/DMA · PYNQ</text>
 <rect x="463" y="366" width="178" height="36" rx="18" fill="#573719"/><text class="f chip" x="552" y="389" text-anchor="middle" fill="#ffc36c">ENGINEERING EVIDENCE</text>
 <text class="f note" x="463" y="418" fill="#8a7a68">Implemented detector system</text>
</g>

<g filter="url(#shadow)">
 <rect x="825" y="132" width="330" height="300" rx="24" fill="#10253b" stroke="#23695f" stroke-width="1.5"/>
 <rect x="825" y="132" width="330" height="9" rx="5" fill="url(#mobile)"/>
 <circle cx="867" cy="187" r="23" fill="#164b45" stroke="#51d1bb" stroke-width="2"/>
 <path d="M856 192h22M860 185h14M864 178h6" stroke="#70e1cd" stroke-width="2.8" stroke-linecap="round"/>
 <text class="f label" x="903" y="179" fill="#57d4bf">03 · IMPLEMENTED CASE</text><text class="f" x="903" y="207" fill="#fff" font-size="19" font-weight="700">MobileNetV1 RTL Accelerator</text>
 <path d="M853 230H1127" stroke="#1d4a47"/>
 <text class="f body" x="853" y="270" fill="#c5d4e1">INT8 QAT · DSC acceleration</text><text class="f body" x="853" y="296" fill="#c5d4e1">ZCU102 · AXI/DMA · PYNQ</text>
 <rect x="853" y="340" width="126" height="36" rx="18" fill="#164b45"/><text class="f chip" x="916" y="363" text-anchor="middle" fill="#70e1cd">MEASURED</text>
 <text class="f note" x="853" y="405" fill="#718ba3">252.7 FPS · 66.9 GOPS/W</text>
</g>

<path d="M600 445 C600 483 226 483 226 436" fill="none" stroke="#5e7892" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<text class="f" x="386" y="482" fill="#8299ae" font-size="12.5">measured evidence refines the engineering map</text>
</svg>
