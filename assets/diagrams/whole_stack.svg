<g transform="translate(230 174)"><rect width="166" height="202" rx="20" fill="#fff" stroke="#ccd9e5"/><circle cx="32" cy="32" r="18" fill="#6f63d9"/><text x="32" y="38" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">2</text><text x="24" y="80" fill="#10253b" font-size="18" font-weight="700">SOFTWARE</text><text x="24" y="111" fill="#60768a" font-size="13">Quantize · prune</text><text x="24" y="133" fill="#60768a" font-size="13">Distill · search</text><path d="M24 160h118" stroke="#e4ebf2"/><text x="24" y="184" fill="#6f63d9" font-size="11.5" font-weight="700">CHANGE THE GRAPH</text></g>
