<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="title desc">
<title id="title">Whole-stack AI accelerator optimization loop</title><desc id="desc">Seven equal-size stages connect model, software, numeric contract, architecture, RTL, physical implementation, and measured system evidence.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient><filter id="s" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1d3954" flood-opacity=".13"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c91a7"/></marker><marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2d78d2"/></marker><style>.f{font-family:Inter,"Segoe UI",Arial,sans-serif}</style></defs>
<rect width="1400" height="610" rx="28" fill="url(#bg)"/><text class="f" x="58" y="64" fill="#10253b" font-size="29" font-weight="700">Optimization is a closed engineering loop</text><text class="f" x="58" y="92" fill="#61788e" font-size="15">A smaller model matters only when hardware converts it into measured cycle, movement, area, or energy savings.</text><rect x="58" y="122" width="1284" height="4" rx="2" fill="#dbe6f0"/>
<!-- Equal 166 x 202 cards, 22px gaps -->
<g class="f" filter="url(#s)">
